name: SignalPilot Market Brief

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "brief"
        type: choice
        options:
          - brief
          - setup-check
          - move-alert
      brief_session_key:
        description: "Brief session label"
        required: false
        default: "post-change-test"
        type: choice
        options:
          - post-change-test
          - market
          - asia-open
          - asia-close
          - london-open
          - london-close
          - new-york-open
          - new-york-close
  schedule:
    - cron: '7 0 * * *'   # 03:07 Київ · Азія · open +1h
    - cron: '7 9 * * *'   # 12:07 Київ · Лондон · open +1h
    - cron: '7 14 * * *'  # 17:07 Київ · Нью-Йорк · open +1h
    - cron: '5,20,35,50 0-21,23 * * *'  # Quiet setup checks; Telegram only on a state change

jobs:
  market-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SIGNALPILOT_JOURNAL_BACKEND: apps_script
      SIGNALPILOT_JOURNAL_API_URL: ${{ secrets.SIGNALPILOT_JOURNAL_API_URL }}
      SIGNALPILOT_JOURNAL_API_TOKEN: ${{ secrets.SIGNALPILOT_JOURNAL_API_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      DISPATCH_MODE: ${{ inputs.mode }}
      DISPATCH_BRIEF_SESSION_KEY: ${{ inputs.brief_session_key }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Resolve run mode
        id: run_mode
        shell: bash
        run: |
          mode="${DISPATCH_MODE:-brief}"
          brief_session="Ринковий контроль"

          fail_mode() {
            echo "mode=unresolved" >> "$GITHUB_OUTPUT"
            echo "brief_session=$brief_session" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$mode" in
              "brief"|"setup-check"|"move-alert")
                ;;
              *)
                fail_mode "Unsupported dispatch mode: $mode"
                ;;
            esac
            case "${DISPATCH_BRIEF_SESSION_KEY:-post-change-test}" in
              "post-change-test")
                brief_session="Тест після правок"
                ;;
              "market")
                brief_session="Ринковий контроль"
                ;;
              "asia-open")
                brief_session="Азія · open +1h"
                ;;
              "asia-close")
                brief_session="Азія · close -1h"
                ;;
              "london-open")
                brief_session="Лондон · open +1h"
                ;;
              "london-close")
                brief_session="Лондон · close -1h"
                ;;
              "new-york-open")
                brief_session="Нью-Йорк · open +1h"
                ;;
              "new-york-close")
                brief_session="Нью-Йорк · close -1h"
                ;;
              *)
                fail_mode "Unsupported brief session key: ${DISPATCH_BRIEF_SESSION_KEY:-}"
                ;;
            esac
          fi

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              "7 0 * * *")
                mode="brief"
                brief_session="Азія · open +1h"
                ;;
              "7 9 * * *")
                mode="brief"
                brief_session="Лондон · open +1h"
                ;;
              "7 14 * * *")
                mode="brief"
                brief_session="Нью-Йорк · open +1h"
                ;;
              "5,20,35,50 0-21,23 * * *")
                mode="setup-check"
                ;;
              *)
                fail_mode "Unsupported scheduled cron: $EVENT_SCHEDULE"
                ;;
            esac
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "brief_session=$brief_session" >> "$GITHUB_OUTPUT"

      - name: Record scheduler start
        id: scheduler_start
        continue-on-error: true
        env:
          PYTHONPATH: src
          SCHEDULER_MODE: ${{ steps.run_mode.outputs.mode }}
          SCHEDULER_STEPS_JSON: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}","conclusion":"${{ steps.checkout.conclusion }}"},"run_mode":{"outcome":"${{ steps.run_mode.outcome }}","conclusion":"${{ steps.run_mode.conclusion }}"}}
        run: python3 -m signalpilot.scheduler_receipt start

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SignalPilot
        id: install
        run: python -m pip install -e .

      - name: Send market brief
        id: send_brief
        if: steps.run_mode.outputs.mode == 'brief'
        run: python -m signalpilot --brief --notify --brief-session "${{ steps.run_mode.outputs.brief_session }}" --symbols BTCUSDT ETHUSDT SOLUSDT

      - name: Evaluate market plans from 48 hours ago
        id: evaluate
        if: always() && steps.install.outcome == 'success' && steps.run_mode.outputs.mode == 'brief'
        run: python -m signalpilot --evaluate --lookahead-candles 48

      - name: Track actionable setups
        id: setup_check
        if: steps.run_mode.outputs.mode == 'setup-check'
        run: python -m signalpilot --setup-check --notify --symbols BTCUSDT ETHUSDT SOLUSDT

      - name: Send move alert
        id: move_alert
        if: steps.run_mode.outputs.mode == 'move-alert'
        run: python -m signalpilot --move-alert --notify --move-threshold-pct 1.5 --symbols BTCUSDT ETHUSDT SOLUSDT

      - name: Record scheduler finish
        id: scheduler_finish
        if: always()
        env:
          PYTHONPATH: src
          SCHEDULER_MODE: ${{ steps.run_mode.outputs.mode || 'unresolved' }}
          SCHEDULER_STATUS: ${{ job.status }}
          SCHEDULER_STEPS_JSON: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}","conclusion":"${{ steps.checkout.conclusion }}"},"run_mode":{"outcome":"${{ steps.run_mode.outcome }}","conclusion":"${{ steps.run_mode.conclusion }}"},"scheduler_start":{"outcome":"${{ steps.scheduler_start.outcome }}","conclusion":"${{ steps.scheduler_start.conclusion }}"},"setup_python":{"outcome":"${{ steps.setup_python.outcome }}","conclusion":"${{ steps.setup_python.conclusion }}"},"install":{"outcome":"${{ steps.install.outcome }}","conclusion":"${{ steps.install.conclusion }}"},"send_brief":{"outcome":"${{ steps.send_brief.outcome }}","conclusion":"${{ steps.send_brief.conclusion }}"},"evaluate":{"outcome":"${{ steps.evaluate.outcome }}","conclusion":"${{ steps.evaluate.conclusion }}"},"setup_check":{"outcome":"${{ steps.setup_check.outcome }}","conclusion":"${{ steps.setup_check.conclusion }}"},"move_alert":{"outcome":"${{ steps.move_alert.outcome }}","conclusion":"${{ steps.move_alert.conclusion }}"}}
        run: python3 -m signalpilot.scheduler_receipt finish
